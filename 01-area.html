<html>
<body>
<script>
let b = Number(prompt("Enter triangle base:"));
let h = Number(prompt("Enter triangle height:"));

document.write("Triangle Base = " + b + "<br>");
document.write("Triangle Height = " + h + "<br>");
document.write("Area of Triangle = " + (b * h / 2) + "<br><br>");

let l = Number(prompt("Enter rectangle length:"));
let w = Number(prompt("Enter rectangle width:"));

document.write("Rectangle Length = " + l + "<br>");
document.write("Rectangle Width = " + w + "<br>");
document.write("Area of Rectangle = " + (l * w) + "<br><br>");

let r = Number(prompt("Enter circle radius:"));

document.write("Circle Radius = " + r + "<br>");
document.write("Area of Circle = " + (Math.PI * r * r).toFixed(2));
</script>
</body>
</html>
