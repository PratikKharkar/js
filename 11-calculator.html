<!DOCTYPE html>
<html>
<body>
<h2>Simple Calculator</h2>

<input type="text" id="display" readonly>
<br><br>

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button onclick="press('/')">/</button>
<br><br>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button onclick="press('*')">*</button>
<br><br>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button onclick="press('-')">-</button>
<br><br>

<button onclick="press('0')">0</button>
<button onclick="press('.')">.</button>
<button onclick="calculate()">=</button>
<button onclick="press('+')">+</button>
<br><br>

<button onclick="square()">x²</button>
<button onclick="clearDisplay()">Clear</button>

<p id="result"></p>

<script>
function press(value) {
    document.getElementById("display").value += value;
}

function calculate() {
    let exp = document.getElementById("display").value;

    if (exp === "") {
        alert("Please enter a calculation.");
        return;
    }

    // Allow only numbers, spaces, decimal points, and basic arithmetic operators.
    if (!/^[0-9+*/.()\- ]+$/.test(exp)) {
        alert("Invalid input.");
        return;
    }

    try {
        let answer = Function('"use strict"; return (' + exp + ')')();

        if (typeof answer !== "number" || !Number.isFinite(answer)) {
            alert("Invalid operation.");
            return;
        }

        document.getElementById("result").innerHTML =
            "Expression = " + exp + "<br>Result = " + answer;
    } catch (e) {
        alert("Invalid calculation.");
    }
}

function square() {
    let value = document.getElementById("display").value;

    if (value === "" || !/^-?\d+(\.\d+)?$/.test(value)) {
        alert("Enter one valid number to find its square.");
        return;
    }

    let n = Number(value);
    document.getElementById("result").innerHTML =
        "Number = " + n + "<br>Square = " + (n * n);
}

function clearDisplay() {
    document.getElementById("display").value = "";
    document.getElementById("result").innerHTML = "";
}
</script>
</body>
</html>
